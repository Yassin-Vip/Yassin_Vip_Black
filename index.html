*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{

  --border:#1e2436;--border2:#2a3247;

  --gold:#d4af37;--gold2:#f4d47e;--gold3:#b8942a;

html,body{height:100%;overflow-x:hidden;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);}
body{padding-bottom:86px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;outline:none;border:none;resize:none;}
img{display:block;max-width:100%;}

::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

#splash{

  background:radial-gradient(circle at 50% 40%,#1a1500,#05060a 70%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .5s ease,visibility .5s ease;
}
#splash.hide{opacity:0;visibility:hidden;}
.splash-logo{font-size:80px;margin-bottom:20px;animation:logoFloat 2s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(212,175,55,.6));}

.splash-title{

  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}
@keyframes shine{0%{background-position:0% 0}100%{background-position:200% 0}}
.splash-sub{color:var(--muted);font-size:12px;margin-top:8px;letter-spacing:2px;}

.header{

  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:rgba(5,6,10,.9);backdrop-filter:blur(20px);

}
.header::after{content:'';position:absolute;bottom:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4;}
.brand{flex:1;display:flex;align-items:center;gap:10px;}
.brand-logo{

}
.brand-text{font-size:17px;font-weight:900;letter-spacing:.5px;}
.brand-text span{background:linear-gradient(135deg,#f4d47e,#d4af37);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.header-btn{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--border);
  font-size:18px;transition:.2s;
}
.header-btn:active{transform:scale(.9);background:var(--gold);color:#000;}

.hero{padding:30px 20px 24px;background:radial-gradient(circle at 20% 20%,rgba(212,175,55,.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(139,92,246,.12),transparent 50%);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%);filter:blur(60px);animation:heroGlow 8s ease-in-out infinite;}
@keyframes heroGlow{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:20px;
  background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);
  color:var(--gold2);font-size:11.5px;font-weight:800;margin-bottom:14px;
}
.hero h1{font-size:28px;font-weight:900;line-height:1.25;margin-bottom:10px;position:relative;}
.hero h1 .gold{background:linear-gradient(135deg,#f4d47e,#d4af37);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:18px;max-width:400px;position:relative;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;}
.hero-btn{padding:12px 22px;border-radius:14px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:.2s;}
.hero-btn.primary{background:linear-gradient(135deg,#d4af37,#b8942a);color:#000;box-shadow:0 10px 30px rgba(212,175,55,.4);}
.hero-btn.primary:active{transform:scale(.97);}
.hero-btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.hero-btn.ghost:active{transform:scale(.97);}

.section{padding:22px 16px 8px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title h2{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;}
.section-title h2 .ico{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.1));display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(212,175,55,.25);}

.product-grid{display:grid;grid-template-columns:1fr;gap:14px;}
.product-card{
  position:relative;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--border);transition:.3s;cursor:pointer;
}

.product-img{

}
.product-img::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(212,175,55,.15),transparent 50%),radial-gradient(circle at 70% 70%,rgba(139,92,246,.1),transparent 50%);}
.product-img img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;}
.product-badge{position:absolute;top:12px;right:12px;z-index:2;padding:5px 12px;border-radius:20px;background:linear-gradient(135deg,#d4af37,#b8942a);color:#000;font-size:10.5px;font-weight:900;box-shadow:0 4px 12px rgba(212,175,55,.4);}
.product-body{padding:16px;}
.product-body h3{font-size:16px;font-weight:900;margin-bottom:6px;}

.product-meta{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);}
.product-price{font-size:18px;font-weight:900;color:var(--gold2);display:flex;align-items:baseline;gap:4px;}
.product-price small{font-size:11px;color:var(--muted);font-weight:600;}
.product-btn{padding:9px 18px;border-radius:12px;background:linear-gradient(135deg,#d4af37,#b8942a);color:#000;font-size:12.5px;font-weight:800;transition:.2s;}
.product-btn:active{transform:scale(.95);}
.product-btn.owned{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}

.bottom-nav{

.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s;}

.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-header h2{font-size:19px;font-weight:900;}
.modal-close{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s;}
.modal-close:active{transform:scale(.9);background:var(--red);}

.fld{margin-bottom:14px;}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:700;}

.btn{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:800;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
.btn-gold{background:linear-gradient(135deg,#d4af37,#b8942a);color:#000;box-shadow:0 12px 30px rgba(212,175,55,.4);}

.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}

.btn-red{background:rgba(239,68,68,.15);color:#f87171;}
.btn-green{background:rgba(16,185,129,.15);color:#34d399;}

.ok-msg{color:#34d399;font-size:13px;text-align:center;margin-top:12px;min-height:18px;font-weight:600;}

.toast{

  background:linear-gradient(135deg,var(--card2),var(--card));
  color:#fff;padding:13px 24px;border-radius:16px;
  font-size:13.5px;font-weight:700;z-index:9999;
  box-shadow:0 20px 50px rgba(0,0,0,.7);
  border:1px solid var(--border2);
  transition:.4s cubic-bezier(.2,.9,.3,1);pointer-events:none;
  white-space:nowrap;max-width:92vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{border-color:rgba(16,185,129,.5);}
.toast.error{border-color:rgba(239,68,68,.5);}
.toast.info{border-color:rgba(212,175,55,.5);}

.empty{padding:50px 24px;text-align:center;color:var(--muted);}
.empty .big{font-size:60px;margin-bottom:14px;opacity:.35;}
.empty h3{font-size:15px;font-weight:800;color:var(--text);margin-bottom:8px;}
.empty p{font-size:13px;line-height:1.7;}

.loading-spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:30px auto;}

.code-box{

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => new Date(t).toLocaleString("ar-EG",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const shortId = () => Math.random().toString(36).slice(2,8).toUpperCase();
const initials = n => (n || "?").trim().charAt(0).toUpperCase();

function toast(msg, type = "info"){
  let t = document.querySelector(".toast");
  if (!t){ t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.className = "toast " + type;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 2800);
}

function openModal(title, bodyHtml){
  $("modalTitle").innerHTML = title;
  $("modalBody").innerHTML = bodyHtml;
  $("modal").classList.add("on");
}
window.closeModal = () => $("modal").classList.remove("on");

onAuthStateChanged(auth, async (user) => {
  if (user){
    state.user = user;
    const snap = await get(ref(db, "users/" + user.uid));
    if (!snap.exists()){
      await set(ref(db, "users/" + user.uid), {
        uid: user.uid, email: user.email,
        displayName: user.displayName || user.email.split("@")[0],
        createdAt: Date.now()
      });
    }
    const prof = await get(ref(db, "users/" + user.uid));
    state.profile = prof.val();
    state.isAdmin = (user.email === DEV_EMAIL);
    listenUserData(user.uid);
    listenAllData();
  } else {
    state.user = null; state.profile = null; state.isAdmin = false;
    state.myRequests = {}; state.myMessages = {}; state.userProducts = {};
  }
  $("splash").classList.add("hide");
  setTimeout(() => {
    $("splash").style.display = "none";
    $("app").style.display = "block";
    buildNav();
    showPage(state.isAdmin ? "admin" : "home");
  }, 500);
});

function listenUserData(uid){
  onValue(ref(db, "userProducts/" + uid), s => { state.userProducts = s.val() || {}; render(); });
  onValue(ref(db, "requests"), s => {
    const all = s.val() || {};
    state.myRequests = {};
    Object.keys(all).forEach(k => { if (all[k].userId === uid) state.myRequests[k] = all[k]; });
    render();
  });
  onValue(ref(db, "messages"), s => {
    const all = s.val() || {};
    state.myMessages = {};
    Object.keys(all).forEach(k => { if (all[k].userId === uid) state.myMessages[k] = all[k]; });
    render();
  });
}

function listenAllData(){
  onValue(ref(db, "products"), s => { state.products = s.val() || {}; render(); });
  onValue(ref(db, "users"), s => { state.allUsers = s.val() || {}; render(); });
  onValue(ref(db, "requests"), s => {
    const all = s.val() || {};
    state.allRequests = all;
    if (state.user){
      state.myRequests = {};
      Object.keys(all).forEach(k => { if (all[k].userId === state.user.uid) state.myRequests[k] = all[k]; });
    }
    render();
  });
  onValue(ref(db, "messages"), s => {
    const all = s.val() || {};
    state.allMessages = all;
    if (state.user){
      state.myMessages = {};
      Object.keys(all).forEach(k => { if (all[k].userId === state.user.uid) state.myMessages[k] = all[k]; });
    }
    render();
  });
}

    <div class="err-msg" id="codeErr"></div>

  `);

async function activateCode(){
  const errEl = $("codeErr"), okEl = $("codeOk"), btn = $("activateBtn");
  errEl.textContent = ""; okEl.textContent = "";
  const code = $("codeInput").value.trim().toUpperCase();
  if (!code){ errEl.textContent = "أدخل الرمز"; return; }
  btn.disabled = true; btn.textContent = "⏳...";

  try {
    const snap = await get(ref(db, "codes"));
    const all = snap.val() || {};
    let matched = null;
    Object.entries(all).forEach(([k, v]) => {
      if ((v.code || "").toUpperCase() === code) matched = { id:k, ...v };
    });

    if (!matched){ errEl.textContent = "❌ رمز غير صحيح"; btn.disabled = false; btn.textContent = "🚀 تفعيل"; return; }
    if (matched.userId && matched.userId !== state.user.uid){ errEl.textContent = "❌ هذا الرمز لا ينتمي لحسابك"; btn.disabled = false; btn.textContent = "🚀 تفعيل"; return; }
    if (matched.used){ errEl.textContent = "❌ تم استخدام الرمز"; btn.disabled = false; btn.textContent = "🚀 تفعيل"; return; }
    if (matched.expiresAt && Date.now() > matched.expiresAt){ errEl.textContent = "❌ انتهت الصلاحية"; btn.disabled = false; btn.textContent = "🚀 تفعيل"; return; }

    const product = state.products[matched.productId];
    if (!product){ errEl.textContent = "❌ المنتج غير موجود"; btn.disabled = false; btn.textContent = "🚀 تفعيل"; return; }

    await update(ref(db, "codes/" + matched.id), { userId: state.user.uid, used: true, usedAt: Date.now() });
    await update(ref(db, "userProducts/" + state.user.uid + "/" + matched.productId), {
      productId: matched.productId, productName: product.name,
      downloadUrl: product.downloadUrl || "", activatedAt: Date.now(), codeId: matched.id
    });

    okEl.textContent = "✅ تم التفعيل!";
    toast("🎉 تم التفعيل","success");
    setTimeout(() => { closeModal(); showPage("account"); }, 1200);
  } catch(err){
    errEl.textContent = "خطأ: " + err.message;
    btn.disabled = false; btn.textContent = "🚀 تفعيل";
  }
}

let adminTab = "overview";

function renderAdmin(){
  if (!state.isAdmin) return `<div class="empty"><div class="big">🔒</div><h3>غير مصرح</h3></div>`;

  const reqs = Object.entries(state.allRequests || {});
  const pending = reqs.filter(([k,r]) => r.status === "pending").length;
  const approved = reqs.filter(([k,r]) => r.status === "approved" || r.status === "issued").length;
  const totalProducts = Object.keys(state.products || {}).length;
  const totalUsers = Object.keys(state.allUsers || {}).length;
  const totalMsgs = Object.keys(state.allMessages || {}).length;

  return `
    <div class="admin-tabs">
      <div class="admin-tab ${adminTab==="overview"?"on":""}" data-atab="overview">📊 نظرة</div>
      <div class="admin-tab ${adminTab==="requests"?"on":""}" data-atab="requests">📋 طلبات ${pending?`(${pending})`:""}</div>
      <div class="admin-tab ${adminTab==="messages"?"on":""}" data-atab="messages">💬 رسائل ${totalMsgs?`(${totalMsgs})`:""}</div>
      <div class="admin-tab ${adminTab==="users"?"on":""}" data-atab="users">👥 مستخدمين (${totalUsers})</div>
      <div class="admin-tab ${adminTab==="products"?"on":""}" data-atab="products">📦 منتجات</div>
    </div>
    <div id="adminContent">${renderAdminTab(adminTab, {pending, approved, totalProducts, totalUsers, totalMsgs})}</div>
  `;
}

function renderAdminTab(tab, stats){
  if (tab === "overview"){
    const recentReqs = Object.entries(state.allRequests || {}).sort((a,b)=>b[1].createdAt-a[1].createdAt).slice(0,5);
    return `
      <div class="admin-stat-grid">
        <div class="admin-stat"><div class="num">${stats.pending}</div><div class="lbl">طلبات جديدة</div></div>
        <div class="admin-stat"><div class="num">${stats.approved}</div><div class="lbl">موافقة</div></div>
        <div class="admin-stat"><div class="num">${stats.totalUsers}</div><div class="lbl">مستخدمين</div></div>
        <div class="admin-stat"><div class="num">${stats.totalProducts}</div><div class="lbl">منتجات</div></div>
      </div>
      <div class="section">
        <div class="section-title"><h2><span class="ico">📋</span> آخر الطلبات</h2></div>
        ${recentReqs.length ? recentReqs.map(([k,r])=>`
          <div class="req-card ${r.status}" onclick="showAdminRequest('${k}')">
            <div class="req-top"><span class="req-id">${esc(r.requestId)}</span><span class="req-status ${r.status}">${statusLabel(r.status)}</span></div>
            <h4>${esc(r.productName)}</h4>
            <div class="info">👤 ${esc(r.userName)} · ${fmt(r.createdAt)}</div>
          </div>
        `).join("") : `<div class="empty" style="padding:30px;"><p>لا توجد طلبات</p></div>`}
      </div>
    `;
  }
  if (tab === "requests"){
    const reqs = Object.entries(state.allRequests || {}).sort((a,b)=>b[1].createdAt-a[1].createdAt);
    return reqs.length ? reqs.map(([k,r])=>`
      <div class="req-card ${r.status}" onclick="showAdminRequest('${k}')">
        <div class="req-top"><span class="req-id">${esc(r.requestId)}</span><span class="req-status ${r.status}">${statusLabel(r.status)}</span></div>
        <h4>${esc(r.productName)}</h4>
        <div class="info">👤 ${esc(r.userName)} · 📧 ${esc(r.userEmail)}</div>
      </div>
    `).join("") : `<div class="empty"><div class="big">📋</div><p>لا توجد طلبات</p></div>`;
  }
  if (tab === "messages"){
    const msgs = Object.entries(state.allMessages || {}).sort((a,b)=>b[1].createdAt-a[1].createdAt);
    const byUser = {};
    msgs.forEach(([k,m]) => {
      if (!byUser[m.userId]) byUser[m.userId] = { userId:m.userId, userName:m.userName, userEmail:m.userEmail, last:m, count:0 };
      byUser[m.userId].count++;
      if (m.createdAt > byUser[m.userId].last.createdAt) byUser[m.userId].last = m;
    });
    const arr = Object.values(byUser).sort((a,b)=>b.last.createdAt - a.last.createdAt);
    return arr.length ? arr.map(u => `
      <div class="req-card" onclick="openUserChat('${u.userId}')">
        <div class="req-top"><span class="req-id">${esc(u.userEmail)}</span><span class="req-status approved">${u.count}</span></div>
        <h4>${esc(u.userName)}</h4>
        <div class="info">${esc(u.last.text).slice(0,80)}</div>
      </div>
    `).join("") : `<div class="empty"><div class="big">💬</div><p>لا توجد رسائل</p></div>`;
  }
  if (tab === "users"){
    const users = Object.entries(state.allUsers || {}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    return users.length ? users.map(([uid,u]) => `
      <div class="req-card">
        <div class="req-top">
          <span class="req-id">${esc(uid.slice(0,10))}...</span>
          <span class="req-status ${u.email === DEV_EMAIL ? "approved" : "pending"}">${u.email === DEV_EMAIL ? "المطور" : "مستخدم"}</span>
        </div>
        <h4>${esc(u.displayName || "بدون اسم")}</h4>
        <div class="info">📧 ${esc(u.email)}</div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-ghost" style="padding:10px;font-size:13px;" onclick="event.stopPropagation();openUserChat('${uid}')">💬 مراسلة</button>
          ${u.email !== DEV_EMAIL ? `<button class="btn btn-red" style="padding:10px;font-size:13px;" onclick="event.stopPropagation();deleteUser('${uid}','${esc(u.email)}')">🗑️ حذف</button>` : ""}
        </div>
      </div>
    `).join("") : `<div class="empty"><div class="big">👥</div><p>لا يوجد مستخدمين</p></div>`;
  }
  if (tab === "products"){
    const prods = Object.entries(state.products || {});
    return `
      <div style="padding:14px;">
        <button class="btn btn-gold" onclick="addProductModal()">➕ إضافة منتج</button>
      </div>
      ${prods.length ? prods.map(([k,p])=>`
        <div class="req-card">
          <div class="req-top">
            <span class="req-id">${esc(k)}</span>
            <span class="req-status ${p.active?'approved':'rejected'}">${p.active?'نشط':'موقوف'}</span>
          </div>
          <h4>${esc(p.name)}</h4>
          <div class="info">💰 ${p.price||0} ج.م</div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-ghost" style="padding:10px;font-size:13px;" onclick="editProductModal('${k}')">✏️ تعديل</button>
            <button class="btn btn-red" style="padding:10px;font-size:13px;" onclick="deleteProduct('${k}')">🗑️ حذف</button>
          </div>
        </div>
      `).join("") : `<div class="empty" style="padding:30px;"><p>لا توجد منتجات</p></div>`}
    `;
  }
  return "";
}

  } else {

  }

  openModal("📋 تفاصيل الطلب", `
    <div class="detail-row"><span class="k">رقم</span><span class="v" style="font-family:monospace;">${esc(r.requestId)}</span></div>
    <div class="detail-row"><span class="k">المنتج</span><span class="v">${esc(r.productName)}</span></div>
    <div class="detail-row"><span class="k">المستخدم</span><span class="v">${esc(r.userName)}</span></div>
    <div class="detail-row"><span class="k">البريد</span><span class="v" style="font-size:11px;">${esc(r.userEmail)}</span></div>
    <div class="detail-row"><span class="k">التاريخ</span><span class="v">${fmt(r.createdAt)}</span></div>
    ${r.code ? `<div class="code-box">${esc(r.code)}</div>` : ""}
    <div style="margin-top:18px;">${actions}</div>
  `);

  if (r.status === "pending"){
    $("approveBtn").onclick = () => approveRequest(reqId);
    $("rejectBtn").onclick = () => rejectRequest(reqId);
  }

window.approveRequest = async (reqId) => {
  const r = state.allRequests[reqId];
  if (!r) return;
  const code = ($("codeGen")?.value.trim() || "YB-" + shortId() + "-" + shortId()).toUpperCase();
  const days = parseInt($("codeDur")?.value || 0) || 0;
  try {
    const expiresAt = days > 0 ? Date.now() + days*24*60*60*1000 : null;
    const codeId = "code_" + shortId() + "_" + Date.now();

    await set(ref(db, "codes/" + codeId), {
      code, userId: r.userId, productId: r.productId,
      requestId: reqId, issuedAt: Date.now(), expiresAt, used: false
    });
    await update(ref(db, "requests/" + reqId), { status: "issued", code, codeId, approvedAt: Date.now() });

    const product = state.products[r.productId];
    if (product){
      await update(ref(db, "userProducts/" + r.userId + "/" + r.productId), {
        productId: r.productId, productName: product.name,
        downloadUrl: product.downloadUrl || "", activatedAt: Date.now(), codeId
      });
    }
    toast("✅ تمت الموافقة","success");
    closeModal();
  } catch(err){ toast("خطأ: " + err.message,"error"); }
};

window.rejectRequest = async (reqId) => {
  if (!confirm("رفض؟")) return;
  try {
    await update(ref(db, "requests/" + reqId), { status: "rejected", rejectedAt: Date.now() });
    toast("تم الرفض","info");
    closeModal();
  } catch(err){ toast("خطأ","error"); }
};

window.openUserChat = (uid) => {
  const u = state.allUsers[uid] || {};
  const msgs = Object.entries(state.allMessages || {})
    .filter(([k,m]) => m.userId === uid)
    .sort((a,b) => (a[1].createdAt||0) - (b[1].createdAt||0));

  openModal(`💬 ${esc(u.displayName || "مستخدم")}`, `
    <div style="background:var(--card2);border-radius:12px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--muted);">
      📧 ${esc(u.email || "")}
    </div>
    <div class="msg-thread" style="min-height:auto;max-height:50vh;overflow-y:auto;">
      ${msgs.length ? msgs.map(([k,m]) => {
        const mine = m.from === "admin";
        return `<div class="bub ${mine?'me':'them'}">${esc(m.text)}<div class="tm">${fmt(m.createdAt)}</div></div>`;
      }).join("") : `<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">لا توجد رسائل</div>`}
    </div>
    <div class="fld" style="margin-top:14px;">
      <textarea id="adminReply" rows="3" placeholder="ردك..."></textarea>
    </div>
    <button class="btn btn-gold" id="adminSendBtn">📤 إرسال</button>
  `);

  $("adminSendBtn").onclick = async () => {
    const text = $("adminReply").value.trim();
    if (!text) return toast("اكتب رسالة","error");
    try {
      const id = "msg_" + Date.now() + "_" + shortId();
      await set(ref(db, "messages/" + id), {
        messageId: id, userId: uid, userEmail: u.email || "",
        userName: u.displayName || "مستخدم",
        from: "admin", text, createdAt: Date.now(), read: false
      });
      toast("✅ تم","success");
      $("adminReply").value = "";
      setTimeout(() => openUserChat(uid), 300);
    } catch(err){ toast("خطأ","error"); }
  };
};

window.deleteUser = async (uid, email) => {
  if (email === DEV_EMAIL) return toast("لا يمكن حذف المطور","error");
  if (!confirm("حذف المستخدم وكل بياناته؟")) return;
  try {
    await remove(ref(db, "users/" + uid));
    await remove(ref(db, "userProducts/" + uid));
    const reqs = state.allRequests || {};
    for (const k of Object.keys(reqs)){ if (reqs[k].userId === uid) await remove(ref(db, "requests/" + k)); }
    const msgs = state.allMessages || {};
    for (const k of Object.keys(msgs)){ if (msgs[k].userId === uid) await remove(ref(db, "messages/" + k)); }
    toast("✅ تم الحذف","success");
  } catch(err){ toast("خطأ: " + err.message,"error"); }
};

window.addProductModal = () => {
  openModal("➕ إضافة منتج", productForm());

function productForm(id, p){
  p = p || {};

    <div class="fld"><label>الاسم *</label><input id="pName" value="${esc(p.name||"")}"></div>

    <div class="fld"><label>رابط الصورة</label><input id="pImage" value="${esc(p.image||"")}"></div>

    <div class="fld"><label>رابط التحميل</label><input id="pUrl" value="${esc(p.downloadUrl||"")}"></div>
    <div class="fld"><label>المميزات (سطر لكل ميزة)</label><textarea id="pFeatures" rows="3">${(p.features||[]).join("\n")}</textarea></div>
    <div class="fld"><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="pReq" ${p.requiresCode?"checked":""} style="width:auto;"> يحتاج رمز</label></div>
    <div class="fld"><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="pActive" ${p.active!==false?"checked":""} style="width:auto;"> نشط</label></div>
    <button class="btn btn-gold" id="pSaveBtn">💾 حفظ</button>
  `;
}

window.saveProduct = async (id) => {
  const data = {
    name: $("pName").value.trim(),
    description: $("pDesc").value.trim(),
    icon: $("pIcon").value.trim() || "📦",
    image: $("pImage").value.trim(),
    price: parseFloat($("pPrice").value) || 0,
    downloadUrl: $("pUrl").value.trim(),
    features: $("pFeatures").value.split("\n").map(x=>x.trim()).filter(Boolean),
    requiresCode: $("pReq").checked,
    active: $("pActive").checked
  };
  if (!data.name) return toast("اكتب اسم","error");
  try {
    if (id){ await update(ref(db, "products/" + id), data); toast("✅ تم","success"); }
    else { await set(ref(db, "products/prod_" + shortId()), data); toast("✅ تمت الإضافة","success"); }
    closeModal();
  } catch(err){ toast("خطأ: " + err.message,"error"); }
};

window.deleteProduct = async (id) => {
  if (!confirm("حذف؟")) return;
  try { await remove(ref(db, "products/" + id)); toast("تم","info"); }
  catch(err){ toast("خطأ","error"); }
};

function attachHandlers(){
  const btnAuth = $("btnAuth");
  if (btnAuth) btnAuth.onclick = () => {
    if (state.user) showPage("account");
    else openAuth("login");

  const sendBtn = $("msgSendBtn");
  if (sendBtn) sendBtn.onclick = sendUserMsg;
  const msgInput = $("msgInput");
  if (msgInput) msgInput.addEventListener("keydown", e => { if (e.key==="Enter") sendUserMsg(); });
}

setTimeout(() => {

    setTimeout(() => {
      $("splash").style.display = "none";
      $("app").style.display = "block";
      buildNav();
      showPage("home");
    }, 500);
  }
}, 2500);
